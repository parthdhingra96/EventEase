<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an EventEase account.">
  <title>Registration | EventEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="ee-header">
    <nav class="navbar navbar-expand-lg navbar-light ee-navbar fixed-top is-scrolled" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand ee-logo" href="index.html">
          <span class="ee-logo-mark">E</span>
          EventEase
        </a>
        <button class="navbar-toggler ee-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#eeNav" aria-controls="eeNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="eeNav">
          <ul class="navbar-nav mx-lg-auto mb-2 mb-lg-0 ee-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Explore Events</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#services">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2 ee-auth">
            <a class="ee-link-quiet" href="login.html">Login</a>
            <a class="btn ee-btn-gold btn-sm" href="register.html" aria-current="page">Register</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="ee-auth-page">
    <div class="container">
      <section class="ee-auth-panel" aria-labelledby="registerTitle">
        <p class="ee-eyebrow">Join EventEase</p>
        <h1 id="registerTitle">Create your account</h1>
        <p class="ee-lead">Set up your profile to begin planning celebrations.</p>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="fullName">Full name</label>
            <input class="form-control" id="fullName" name="fullName" type="text" autocomplete="name" required>
            <p class="ee-field-error" id="fullNameError" role="alert"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="registerEmail">Email</label>
            <input class="form-control" id="registerEmail" name="email" type="email" autocomplete="email" required>
            <p class="ee-field-error" id="registerEmailError" role="alert"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="mobile">Mobile number</label>
            <input class="form-control" id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel" placeholder="10-digit Indian mobile number" required>
            <p class="ee-field-error" id="mobileError" role="alert"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="registerPassword">Password</label>
            <div class="ee-password-wrap">
              <input class="form-control" id="registerPassword" name="password" type="password" autocomplete="new-password" required>
              <button class="ee-password-toggle" type="button" data-password-toggle="registerPassword" aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="ee-field-hint">Use 8+ characters with uppercase, lowercase, and a number.</p>
            <p class="ee-field-error" id="registerPasswordError" role="alert"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="ee-password-wrap">
              <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
              <button class="ee-password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="ee-field-error" id="confirmPasswordError" role="alert"></p>
          </div>

          <button class="btn ee-btn-gold ee-auth-submit" type="submit">Register</button>
          <p class="ee-auth-status" id="registerStatus" role="status" aria-live="polite"></p>
        </form>

        <p class="ee-auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
