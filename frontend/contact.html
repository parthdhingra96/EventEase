
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | EventEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #101010;
            color: #fff;
        }

        .contact-container {
            max-width: 750px;
            margin: 80px auto;
            padding: 30px;
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 15px;
        }

        .contact-title {
            color: #b08a45;
            text-align: center;
            margin-bottom: 10px;
        }

        .contact-subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-label {
            color: #ddd;
        }

        .form-control {
            background: #292929;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
        }

        .form-control:focus {
            background: #292929;
            color: #fff;
            border-color: #b08a45;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #999;
        }

        .contact-btn {
            background: #b08a45;
            color: #111;
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
        }

        .contact-btn:hover {
            background: #d0a85d;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="contact-container">

            <h1 class="contact-title">Contact Us</h1>

            <p class="contact-subtitle">
                Have a question? Get in touch with the EventEase team.
            </p>

            <form id="contactForm">

                <div class="mb-3">
                    <label class="form-label" for="contactName">Full Name</label>
                    <input type="text" class="form-control"
                        id="contactName" placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="contactEmail">Email Address</label>
                    <input type="email" class="form-control"
                        id="contactEmail" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="contactPhone">Mobile Number</label>
                    <input type="tel" class="form-control"
                        id="contactPhone" placeholder="Enter your mobile number" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="contactMessage">Message</label>
                    <textarea class="form-control"
                        id="contactMessage" rows="5"
                        placeholder="Write your message..." required></textarea>
                </div>

                <button type="submit" class="btn contact-btn">
                    Send Message
                </button>

                <div id="contactStatus" class="mt-3 text-center"></div>

            </form>

            <div class="text-center mt-4">
                <a href="index.html" style="color:#b08a45;">
                    Back to Home
                </a>
            </div>

        </div>

    </div>

    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
</body>

</html>
