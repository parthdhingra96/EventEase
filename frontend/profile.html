
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | EventEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #101010;
            color: #fff;
        }

        .profile-container {
            max-width: 700px;
            margin: 70px auto;
            padding: 35px;
            background: #1c1c1c;
            border: 1px solid #b08a45;
            border-radius: 14px;
        }

        .profile-title {
            color: #b08a45;
            margin-bottom: 30px;
        }

        .profile-field {
            padding: 15px;
            margin-bottom: 15px;
            background: #292929;
            border-radius: 8px;
        }

        .profile-field strong {
            color: #b08a45;
        }

        #profileStatus {
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="profile-container">
            <h2 class="profile-title text-center">My Profile</h2>

            <p id="profileStatus" class="text-center">
                Loading your profile...
            </p>

            <div id="profileDetails" style="display: none;">
                <div class="profile-field">
                    <strong>User ID:</strong>
                    <span id="userId"></span>
                </div>

                <div class="profile-field">
                    <strong>Full Name:</strong>
                    <span id="fullName"></span>
                </div>

                <div class="profile-field">
                    <strong>Email:</strong>
                    <span id="email"></span>
                </div>

                <div class="profile-field">
                    <strong>Mobile:</strong>
                    <span id="mobile"></span>
                </div>

                <div class="profile-field">
                    <strong>Account Created:</strong>
                    <span id="createdAt"></span>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="index.html" class="btn ee-btn-gold">
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
