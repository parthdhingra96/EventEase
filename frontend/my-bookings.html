
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your EventEase bookings.">

    <title>My Bookings | EventEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #101010;
            color: #fff;
        }

        .bookings-container {
            max-width: 1100px;
            margin: 100px auto 60px;
        }

        .bookings-title {
            color: #b08a45;
            margin-bottom: 10px;
        }

        .booking-card {
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .booking-card h4 {
            color: #b08a45;
            margin-bottom: 18px;
        }

        .booking-info {
            margin-bottom: 12px;
            color: #ddd;
        }

        .booking-info strong {
            color: #b08a45;
        }

        .booking-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            background: #493b1c;
            color: #f1c76b;
        }

        #bookingsMessage {
            color: #ccc;
            text-align: center;
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <div class="container bookings-container">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="bookings-title">My Bookings</h1>
                <p class="text-secondary">View all your EventEase bookings.</p>
            </div>

            <a href="index.html" class="btn ee-btn-gold">
                Back to Home
            </a>
        </div>

        <div id="bookingsMessage">
            Loading your bookings...
        </div>

        <div id="bookingsList"></div>

    </div>

    <script src="js/my-bookings.js"></script>

</body>
</html>
