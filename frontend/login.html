<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to EventEase.">
  <title>Login | EventEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="ee-header">
    <nav class="navbar navbar-expand-lg navbar-light ee-navbar fixed-top is-scrolled" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand ee-logo" href="index.html">
          <span class="ee-logo-mark">E</span>
          EventEase
        </a>
        <button class="navbar-toggler ee-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#eeNav" aria-controls="eeNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="eeNav">
          <ul class="navbar-nav mx-lg-auto mb-2 mb-lg-0 ee-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Explore Events</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#services">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2 ee-auth">
            <a class="ee-link-quiet" href="login.html" aria-current="page">Login</a>
            <a class="btn ee-btn-gold btn-sm" href="register.html">Register</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="ee-auth-page">
    <div class="container">
      <section class="ee-auth-panel" aria-labelledby="loginTitle">
        <p class="ee-eyebrow">Welcome back</p>
        <h1 id="loginTitle">Log in to EventEase</h1>
        <p class="ee-lead">Access your event planning account.</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email</label>
            <input class="form-control" id="loginEmail" name="email" type="email" autocomplete="email" required>
            <p class="ee-field-error" id="loginEmailError" role="alert"></p>
          </div>

          <div class="mb-3">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="ee-password-wrap">
              <input class="form-control" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
              <button class="ee-password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="ee-field-error" id="loginPasswordError" role="alert"></p>
          </div>

          <div class="ee-auth-options">
            <div class="form-check">
              <input class="form-check-input" id="rememberMe" name="rememberMe" type="checkbox">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <button class="ee-text-button" id="forgotPassword" type="button">Forgot password?</button>
          </div>

          <button class="btn ee-btn-gold ee-auth-submit" type="submit">Login</button>
          <p class="ee-auth-status" id="loginStatus" role="status" aria-live="polite"></p>
        </form>

        <p class="ee-auth-switch">New to EventEase? <a href="register.html">Create an account</a></p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
